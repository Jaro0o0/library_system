services:

  frontend:
    build: ./frontend
    ports:
     - "3000:80"
    depends_on:
      - backend


  librarydatabase:
    image: postgres:18
    environment:
      POSTGRES_DB: librarydatabase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d librarydatabase"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: build
    working_dir: /src
    entrypoint: ["sh", "-c", "dotnet tool restore && dotnet ef database update"]
    env_file:
      - ./backend/.env
    depends_on:
      librarydatabase:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "5000:8080"
    env_file:
      - ./backend/.env
    depends_on:
      librarydatabase:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data: